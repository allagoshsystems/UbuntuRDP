
name: Ubuntu GNOME RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Update Ubuntu package lists
        run: |
          sudo apt-get update

      - name: Install GNOME Desktop and XRDP
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get install -y --no-install-recommends \
            ubuntu-desktop-minimal \
            gnome-session \
            gnome-shell \
            ubuntu-session \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            x11-xserver-utils \
            policykit-1 \
            gnome-terminal \
            nautilus \
            network-manager \
            fonts-ubuntu

      - name: Install Firefox
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading Firefox..."

          curl -fL --retry 3 \
            "https://download.mozilla.org/?product=firefox-latest&os=linux64&lang=en-US" \
            -o /tmp/firefox.tar.xz

          echo "Checking downloaded archive..."
          file /tmp/firefox.tar.xz

          mkdir -p /tmp/firefox-check
          tar -xJf /tmp/firefox.tar.xz -C /tmp/firefox-check

          sudo rm -rf /opt/firefox
          sudo mv /tmp/firefox-check/firefox /opt/firefox

          sudo ln -sf /opt/firefox/firefox /usr/local/bin/firefox

          sudo tee /usr/share/applications/firefox.desktop > /dev/null <<'EOF'
          [Desktop Entry]
          Name=Firefox
          Exec=/usr/local/bin/firefox %u
          Terminal=false
          Type=Application
          Icon=/opt/firefox/browser/chrome/icons/default/default128.png
          Categories=Network;WebBrowser;
          EOF

          firefox --version
          echo "Firefox installed successfully!"

      - name: Configure RDP user and GNOME session
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if [ -z "$RDP_PASSWORD" ]; then
            echo "ERROR: Add RDP_PASSWORD in repository Actions secrets."
            exit 1
          fi

          printf 'runner:%s\n' "$RDP_PASSWORD" | sudo chpasswd

          mkdir -p "$HOME"
          echo "exec dbus-run-session -- gnome-session --session=ubuntu" > "$HOME/.xsession"
          chmod +x "$HOME/.xsession"

          sudo adduser xrdp ssl-cert || true
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Show RDP connection details
        run: |
          echo "=================================="
          echo "GNOME RDP SERVER IS READY"
          echo "=================================="
          echo "Username: runner"
          echo "Password: Your RDP_PASSWORD secret"
          echo "Tailscale IP:"
          tailscale ip -4
          echo "=================================="

      - name: Keep RDP running
        run: |
          while true; do
            sleep 60
          done
