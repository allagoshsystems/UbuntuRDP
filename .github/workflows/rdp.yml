
name: Ubuntu GNOME RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Validate Secrets
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          test -n "$RDP_PASSWORD" || {
            echo "::error::Missing RDP_PASSWORD"
            exit 1
          }

          test -n "$TS_AUTHKEY" || {
            echo "::error::Missing TS_AUTHKEY"
            exit 1
          }

      - name: Prepare Package Manager
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates wget gnupg

      - name: Configure Mozilla Repository
        shell: bash
        run: |
          set -euo pipefail

          sudo install -d -m 0755 /etc/apt/keyrings

          wget -q https://packages.mozilla.org/apt/repo-signing-key.gpg \
            -O /tmp/mozilla-key.gpg

          FINGERPRINT="$(gpg --show-keys --with-colons \
            /tmp/mozilla-key.gpg |
            awk -F: '$1 == "fpr" {print $10; exit}')"

          if [[ "$FINGERPRINT" != "35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3" ]]; then
            echo "::error::Mozilla signing key verification failed"
            exit 1
          fi

          sudo cp /tmp/mozilla-key.gpg \
            /etc/apt/keyrings/packages.mozilla.org.asc

          echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" \
            | sudo tee /etc/apt/sources.list.d/mozilla.list

          sudo tee /etc/apt/preferences.d/mozilla > /dev/null <<'EOF'
          Package: *
          Pin: origin packages.mozilla.org
          Pin-Priority: 1000

          Package: firefox
          Pin: release o=Ubuntu
          Pin-Priority: -1
          EOF

          sudo apt-get update

      - name: Install Minimal GNOME and Firefox
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          sudo apt-get install -y --no-install-recommends \
            ubuntu-session \
            gnome-terminal \
            nautilus \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            x11-xserver-utils \
            policykit-1 \
            firefox

          echo "Installed GNOME components:"
          dpkg -l | grep -E 'gnome-shell|gnome-session|ubuntu-session|xrdp|firefox' || true

          firefox --version

      - name: Configure GNOME RDP
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          printf 'runner:%s\n' "$RDP_PASSWORD" | sudo chpasswd

          cat > "$HOME/.xsession" <<'EOF'
          #!/bin/sh

          export DESKTOP_SESSION=ubuntu-xorg
          export XDG_SESSION_DESKTOP=ubuntu-xorg
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-ubuntu-xorg:/etc/xdg
          export XDG_CURRENT_DESKTOP=ubuntu:GNOME
          export XDG_DATA_DIRS=/usr/share/ubuntu-xorg:/usr/share/gnome:/usr/local/share:/usr/share:/var/lib/snapd/desktop
          export GNOME_SHELL_SESSION_MODE=ubuntu

          unset DBUS_SESSION_BUS_ADDRESS

          exec dbus-run-session -- /usr/bin/gnome-session --session=ubuntu
          EOF

          chmod +x "$HOME/.xsession"

          sudo adduser xrdp ssl-cert || true

          sudo systemctl enable xrdp xrdp-sesman
          sudo systemctl restart xrdp-sesman
          sudo systemctl restart xrdp

      - name: Check RDP
        run: |
          sleep 5

          if ! sudo ss -ltn | grep -q ':3389'; then
            echo "::error::XRDP failed to start"
            sudo journalctl -u xrdp -u xrdp-sesman --no-pager -n 60
            exit 1
          fi

          echo "RDP server is listening."

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Display Connection Details
        run: |
          IP="$(tailscale ip -4 | head -n 1)"

          echo "================================"
          echo "       GNOME RDP READY"
          echo "================================"
          echo "IP:       $IP"
          echo "Port:     3389"
          echo "Username: runner"
          echo "Password: Your RDP_PASSWORD secret"
          echo "Desktop:  Ubuntu GNOME"
          echo "Browser:  Firefox"
          echo "================================"

          {
            echo "## GNOME RDP READY"
            echo "- IP: \`$IP\`"
            echo "- Port: 3389"
            echo "- Username: runner"
            echo "- Password: Your RDP_PASSWORD secret"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Desktop Running
        run: |
          while true; do
            sleep 60
          done
