
name: Start Full Ubuntu GNOME RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      # ==========================================
      # 1. UPDATE UBUNTU
      # ==========================================
      - name: Update Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y

      # ==========================================
      # 2. INSTALL FULL UBUNTU GNOME DESKTOP
      # ==========================================
      - name: Install Ubuntu GNOME Desktop
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ubuntu-desktop-minimal \
            gnome-session \
            gnome-shell \
            ubuntu-session \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            x11-xserver-utils \
            policykit-1

      # ==========================================
      # 3. INSTALL FIREFOX
      # ==========================================
      - name: Install Firefox Browser
        run: |
          sudo apt-get install -y wget ca-certificates

          wget -q \
            "https://download.mozilla.org/?product=firefox-latest&os=linux64&lang=en-US" \
            -O /tmp/firefox.tar.xz

          sudo tar -xJf /tmp/firefox.tar.xz -C /opt/

          sudo ln -sf /opt/firefox/firefox /usr/local/bin/firefox

          sudo mkdir -p /usr/local/share/applications

          sudo tee /usr/local/share/applications/firefox.desktop > /dev/null <<'EOF'
          [Desktop Entry]
          Name=Firefox
          Comment=Web Browser
          Exec=/opt/firefox/firefox %u
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          Icon=/opt/firefox/browser/chrome/icons/default/default128.png
          StartupNotify=true
          EOF

      # ==========================================
      # 4. CONFIGURE RDP USER
      # ==========================================
      - name: Configure Ubuntu RDP Account
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if [ -z "$RDP_PASSWORD" ]; then
            echo "::error::RDP_PASSWORD secret is missing."
            exit 1
          fi

          printf 'runner:%s\n' "$RDP_PASSWORD" | sudo chpasswd

          mkdir -p "$HOME/.config"
          
          cat > "$HOME/.xsession" <<'EOF'
          #!/bin/sh
          export XDG_CURRENT_DESKTOP=ubuntu:GNOME
          export XDG_SESSION_DESKTOP=ubuntu
          export DESKTOP_SESSION=ubuntu
          export MOZ_ENABLE_WAYLAND=0

          exec dbus-run-session -- gnome-session --session=ubuntu
          EOF

          chmod 700 "$HOME/.xsession"

          sudo adduser xrdp ssl-cert || true

      # ==========================================
      # 5. CONFIGURE XRDP
      # ==========================================
      - name: Configure XRDP
        run: |
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 5

          sudo systemctl is-active --quiet xrdp

          echo "XRDP service is running."

      # ==========================================
      # 6. CONNECT TAILSCALE
      # ==========================================
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # ==========================================
      # 7. DISPLAY RDP INFORMATION
      # ==========================================
      - name: Display RDP Connection
        run: |
          RDP_IP="$(tailscale ip -4 | head -n 1)"

          if [ -z "$RDP_IP" ]; then
            echo "::error::Tailscale IP unavailable."
            exit 1
          fi

          echo "=================================="
          echo "   UBUNTU GNOME RDP IS READY"
          echo "=================================="
          echo "IP: $RDP_IP"
          echo "Port: 3389"
          echo "Username: runner"
          echo "Desktop: Ubuntu GNOME"
          echo "Browser: Firefox"
          echo "=================================="

          {
            echo "# Ubuntu GNOME RDP Ready"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| RDP Address | $RDP_IP |"
            echo "| Port | 3389 |"
            echo "| Username | runner |"
            echo "| Desktop | Ubuntu GNOME |"
            echo "| Browser | Firefox |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ==========================================
      # 8. KEEP DESKTOP RUNNING
      # ==========================================
      - name: Keep Ubuntu Desktop Alive
        run: |
          echo "Ubuntu GNOME desktop is running."
          echo "Use Stop Linux RDP to terminate the session."

          while true; do
            echo "GNOME RDP ACTIVE: $(date -u)"
            sleep 60
          done
