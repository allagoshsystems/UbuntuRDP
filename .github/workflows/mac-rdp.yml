
name: macOS Remote Desktop - TigerVNC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-remote-desktop:
    name: Start macOS VNC Server
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - name: Check macOS Environment
        shell: bash
        run: |
          set -euo pipefail
          echo "=================================="
          echo "MACOS REMOTE DESKTOP"
          echo "=================================="
          sw_vers
          echo "Username: $(whoami)"
          echo "Architecture: $(uname -m)"
          echo "=================================="

      - name: Enable Apple Remote Management and VNC
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.MAC_VNC_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$VNC_PASSWORD" ]]; then
            echo "ERROR: MAC_VNC_PASSWORD secret is missing."
            exit 1
          fi

          if [[ ${#VNC_PASSWORD} -gt 8 ]]; then
            echo "ERROR: Legacy VNC password must be 8 characters or fewer."
            exit 1
          fi

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          echo "Configuring Apple Remote Management..."

          sudo "$KICKSTART" \
            -activate \
            -configure \
            -access -on \
            -users "$(whoami)" \
            -privs -all \
            -clientopts \
            -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "$VNC_PASSWORD" \
            -restart -agent

          echo "Remote Management configuration completed."

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Display Tailscale Connection Information
        shell: bash
        run: |
          set -euo pipefail

          echo "Tailscale status:"
          tailscale status

          MAC_IP="$(tailscale ip -4 | head -n 1)"

          if [[ -z "$MAC_IP" ]]; then
            echo "ERROR: Tailscale IP not found."
            exit 1
          fi

          echo "=================================="
          echo "MACOS VNC CONNECTION"
          echo "=================================="
          echo "IP ADDRESS: $MAC_IP"
          echo "VNC PORT: 5900"
          echo "USERNAME: $(whoami)"
          echo "=================================="

          {
            echo "## macOS VNC Connection"
            echo ""
            echo "- **IP:** \`$MAC_IP\`"
            echo "- **Port:** \`5900\`"
            echo "- **Username:** \`$(whoami)\`"
            echo "- **Client:** TigerVNC Viewer"
            echo ""
            echo "Connect using: \`$MAC_IP:5900\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify VNC Server
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing local VNC service..."

          for i in {1..30}; do
            if nc -z 127.0.0.1 5900; then
              echo "SUCCESS: VNC port 5900 is listening."
              break
            fi

            echo "Waiting for VNC server... ($i/30)"
            sleep 2
          done

          if ! nc -z 127.0.0.1 5900; then
            echo "ERROR: VNC server did not start."
            sudo launchctl list | grep -i -E 'remote|screen' || true
            exit 1
          fi

          echo "VNC server port verification completed."

      - name: Verify Remote Management Status
        shell: bash
        run: |
          echo "Checking Apple Remote Management..."
          sudo launchctl list | grep -i -E 'remote|screen' || true

          echo "Checking VNC port..."
          nc -vz 127.0.0.1 5900

          echo "Diagnostics completed."

      - name: Keep macOS Runner Alive
        shell: bash
        run: |
          echo "=================================="
          echo "MACOS REMOTE DESKTOP IS RUNNING"
          echo "=================================="

          while true; do
            echo "VNC session active: $(date)"
            sleep 300
          done
