
name: macOS Remote Desktop - TigerVNC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-remote-desktop:
    name: macOS Remote Desktop
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - name: Check macOS
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          echo "Current account: $(whoami)"
          echo "Architecture: $(uname -m)"

      - name: Create Dedicated VNC Account
        shell: bash
        env:
          VNC_USER_PASSWORD: ${{ secrets.MACOS_LOGIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$VNC_USER_PASSWORD" ]]; then
            echo "ERROR: MACOS_LOGIN_PASSWORD secret is missing."
            exit 1
          fi

          ACCOUNT="vncuser"

          if dscl . -read "/Users/$ACCOUNT" >/dev/null 2>&1; then
            echo "VNC account already exists."
          else
            echo "Creating dedicated VNC account..."

            sudo sysadminctl \
              -addUser "$ACCOUNT" \
              -fullName "VNC Remote User" \
              -password "$VNC_USER_PASSWORD"

          fi

          echo "Checking VNC account..."

          id "$ACCOUNT"
          echo "Dedicated account ready."

      - name: Enable Apple Remote Management
        shell: bash
        run: |
          set -euo pipefail

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          echo "Activating Remote Management..."

          sudo "$KICKSTART" -activate

          echo "Granting VNC user access..."

          sudo "$KICKSTART" \
            -configure \
            -access -on \
            -users vncuser \
            -privs -all

          echo "Restarting Apple Remote Management..."

          sudo "$KICKSTART" -restart -agent

          echo "Remote Management configuration finished."

      - name: Connect Tailscale VPN
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Get Tailscale IP
        shell: bash
        run: |
          set -euo pipefail

          tailscale status

          MAC_IP="$(tailscale ip -4 | head -n 1)"

          if [[ -z "$MAC_IP" ]]; then
            echo "ERROR: No Tailscale IP found."
            exit 1
          fi

          echo "MAC_IP=$MAC_IP" >> "$GITHUB_ENV"

          {
            echo "## macOS TigerVNC Connection"
            echo ""
            echo "- IP: \`$MAC_IP\`"
            echo "- Port: \`5900\`"
            echo "- Username: \`vncuser\`"
            echo "- Authentication: Apple account"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "================================"
          echo "MACOS REMOTE DESKTOP"
          echo "IP: $MAC_IP"
          echo "PORT: 5900"
          echo "USERNAME: vncuser"
          echo "================================"

      - name: Test VNC Server
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing VNC port..."

          for i in {1..30}; do
            if nc -z 127.0.0.1 5900; then
              echo "VNC port 5900 is listening."
              break
            fi

            echo "Waiting for VNC service ($i/30)"
            sleep 2
          done

          if ! nc -z 127.0.0.1 5900; then
            echo "ERROR: VNC server is not listening."
            sudo launchctl list | grep -i -E 'remote|screen' || true
            exit 1
          fi

          echo "VNC port verification successful."

      - name: Remote Management Diagnostics
        shell: bash
        run: |
          echo "Checking account..."
          id vncuser

          echo "Checking services..."
          sudo launchctl list | grep -i -E 'remote|screen' || true

          echo "Checking port..."
          nc -vz 127.0.0.1 5900

          echo "Diagnostics completed."

      - name: Keep Remote Desktop Alive
        shell: bash
        run: |
          echo "================================"
          echo "MACOS SESSION IS RUNNING"
          echo "================================"

          while true; do
            echo "Session active: $(date)"
            sleep 300
          done
