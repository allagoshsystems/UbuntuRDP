
name: macOS Remote Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-rdp:
    name: Start macOS VNC Desktop
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - name: Check macOS
        run: |
          sw_vers
          echo "macOS user: $(id -un)"
          echo "Architecture: $(uname -m)"

      - name: Configure VNC Authentication
        env:
          VNC_PASSWORD: ${{ secrets.MAC_VNC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$VNC_PASSWORD" ]; then
            echo "ERROR: MAC_VNC_PASSWORD secret is missing."
            exit 1
          fi

          if [ "${#VNC_PASSWORD}" -gt 8 ]; then
            echo "ERROR: VNC password must be 8 characters or fewer."
            exit 1
          fi

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          if [ ! -x "$KICKSTART" ]; then
            echo "ERROR: Apple Remote Management tool not found."
            exit 1
          fi

          echo "Configuring VNC password authentication..."

          sudo "$KICKSTART" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes \
            -setvncpw \
            -vncpw "$VNC_PASSWORD"

          echo "Enabling Remote Management access..."

          MAC_USER="$(id -un)"

          sudo "$KICKSTART" \
            -activate \
            -configure \
            -access -on \
            -users "$MAC_USER" \
            -privs -all \
            -restart -agent

          echo "VNC configuration commands completed."

      - name: Verify VNC Service
        shell: bash
        run: |
          echo "Checking VNC port..."

          for i in {1..30}; do
            if nc -z 127.0.0.1 5900; then
              echo "SUCCESS: VNC port 5900 is listening."
              break
            fi

            echo "Waiting for VNC service... ($i/30)"
            sleep 2
          done

          if ! nc -z 127.0.0.1 5900; then
            echo "ERROR: VNC port did not start."
            exit 1
          fi

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Display Connection Information
        shell: bash
        run: |
          echo "=================================="
          echo "       MACOS REMOTE DESKTOP"
          echo "=================================="

          echo "USERNAME: $(id -un)"
          echo "VNC ADDRESS: $(tailscale ip -4):5900"
          echo "PORT: 5900"
          echo "NETWORK: Tailscale"
          echo "=================================="

      - name: Keep macOS Runner Alive
        run: |
          echo "Remote desktop session running."

          while true; do
            sleep 300
          done
