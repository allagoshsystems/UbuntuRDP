
name: macOS Remote Desktop - TigerVNC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-remote-desktop:
    name: macOS VNC Remote Desktop
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - name: Check macOS Environment
        shell: bash
        run: |
          set -euo pipefail
          echo "=================================="
          echo "MACOS REMOTE DESKTOP"
          echo "=================================="
          sw_vers
          echo "Username: $(whoami)"
          echo "Architecture: $(uname -m)"

      - name: Set macOS Account Password
        shell: bash
        env:
          LOGIN_PASSWORD: ${{ secrets.MACOS_LOGIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$LOGIN_PASSWORD" ]]; then
            echo "ERROR: MACOS_LOGIN_PASSWORD is missing."
            exit 1
          fi

          ACCOUNT="$(whoami)"

          echo "Setting dedicated password for $ACCOUNT..."

          sudo dscl . -passwd "/Users/$ACCOUNT" "$LOGIN_PASSWORD"

          echo "Verifying account authentication..."

          if sudo dscl . -authonly "$ACCOUNT" "$LOGIN_PASSWORD"; then
            echo "Account password successfully verified."
          else
            echo "ERROR: Account password verification failed."
            exit 1
          fi

      - name: Enable Apple Remote Management
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT="$(whoami)"

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          echo "Activating Apple Remote Management..."

          sudo "$KICKSTART" -activate

          echo "Configuring account permissions..."

          sudo "$KICKSTART" \
            -configure \
            -access -on \
            -users "$ACCOUNT" \
            -privs -all

          echo "Restarting Remote Management..."

          sudo "$KICKSTART" -restart -agent

          echo "Remote Management configuration completed."

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Display Connection Information
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Tailscale..."

          tailscale status

          MAC_IP="$(tailscale ip -4 | head -n 1)"

          if [[ -z "$MAC_IP" ]]; then
            echo "ERROR: Tailscale IP unavailable."
            exit 1
          fi

          {
            echo "## macOS TigerVNC Connection"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| IP Address | $MAC_IP |"
            echo "| Port | 5900 |"
            echo "| Username | runner |"
            echo "| Authentication | Apple Account |"
            echo "| Viewer | TigerVNC 1.14.1+ |"
            echo ""
            echo "Connect using: \`$MAC_IP:5900\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=================================="
          echo "MAC IP: $MAC_IP"
          echo "PORT: 5900"
          echo "USERNAME: runner"
          echo "=================================="

      - name: Verify VNC Connection
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing VNC service..."

          for i in {1..30}; do
            if nc -z 127.0.0.1 5900; then
              echo "VNC port 5900 is available."
              break
            fi

            echo "Waiting for VNC service ($i/30)"
            sleep 2
          done

          if ! nc -z 127.0.0.1 5900; then
            echo "ERROR: VNC service is unavailable."
            sudo launchctl list | grep -i -E 'remote|screen' || true
            exit 1
          fi

          echo "VNC service verification successful."

      - name: Verify Remote Management
        shell: bash
        run: |
          set -euo pipefail

          echo "Remote Management services:"
          sudo launchctl list | grep -i -E 'remote|screen' || true

          echo "VNC listening port:"
          nc -vz 127.0.0.1 5900

          echo "Diagnostics completed."

      - name: Keep Remote Desktop Running
        shell: bash
        run: |
          echo "=================================="
          echo "MACOS REMOTE DESKTOP IS READY"
          echo "=================================="

          while true; do
            echo "Remote desktop active: $(date)"
            sleep 300
          done
