
name: macOS VNC Remote Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-vnc:
    name: Configure macOS VNC
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      # ==========================================
      # 1. VALIDATE GITHUB SECRETS
      # ==========================================
      - name: Validate Secrets
        shell: bash
        env:
          MAC_VNC_PASSWORD: ${{ secrets.MAC_VNC_PASSWORD }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euo pipefail

          if [ -z "$MAC_VNC_PASSWORD" ]; then
            echo "ERROR: Missing MAC_VNC_PASSWORD"
            exit 1
          fi

          # Legacy Apple VNC password: exactly 8 printable ASCII bytes
          if ! printf '%s' "$MAC_VNC_PASSWORD" |
            LC_ALL=C awk 'length($0) != 8 || /[^!-~]/ { exit 1 }'; then
            echo "ERROR: VNC password must be exactly 8 printable ASCII characters."
            exit 1
          fi

          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR: Missing TS_AUTHKEY"
            exit 1
          fi

          echo "Secrets validation successful."

      # ==========================================
      # 2. CONFIGURE APPLE REMOTE MANAGEMENT
      # ==========================================
      - name: Enable Apple Remote Management
        shell: bash
        run: |
          set -euo pipefail

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          if [ ! -x "$KICKSTART" ]; then
            echo "ERROR: Apple Remote Management not found."
            exit 1
          fi

          MAC_USER="$(whoami)"

          echo "Configuring Remote Management..."
          echo "Account: $MAC_USER"

          sudo "$KICKSTART" \
            -activate \
            -configure \
            -access -on \
            -users "$MAC_USER" \
            -privs -all

          echo "Apple Remote Management activated."

      # ==========================================
      # 3. CONFIGURE LEGACY VNC PASSWORD
      # ==========================================
      - name: Configure VNC Authentication
        shell: bash
        env:
          MAC_VNC_PASSWORD: ${{ secrets.MAC_VNC_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          echo "Enabling legacy VNC authentication..."

          sudo "$KICKSTART" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes \
            -setvncpw \
            -vncpw "$MAC_VNC_PASSWORD"

          echo "Restarting Apple Remote Desktop agent..."

          sudo "$KICKSTART" -restart -agent

          sleep 10

          echo "VNC authentication configuration completed."

      # ==========================================
      # 4. VERIFY LOCAL VNC SERVER
      # ==========================================
      - name: Verify Local VNC
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking VNC port 5900..."

          for i in {1..15}; do
            if nc -z -w 3 127.0.0.1 5900; then
              echo "SUCCESS: VNC is listening locally."
              break
            fi

            if [ "$i" -eq 15 ]; then
              echo "ERROR: VNC server did not start."
              sudo lsof -nP -iTCP:5900 || true
              exit 1
            fi

            sleep 2
          done

          echo "VNC local connection verified."

      # ==========================================
      # 5. CONNECT TAILSCALE
      # ==========================================
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # ==========================================
      # 6. VERIFY TAILSCALE CONNECTION
      # ==========================================
      - name: Verify Network and Display Credentials
        shell: bash
        run: |
          set -euo pipefail

          IP="$(tailscale ip -4 | head -n 1)"
          USER_NAME="$(whoami)"

          if [ -z "$IP" ]; then
            echo "ERROR: Tailscale IP unavailable."
            exit 1
          fi

          echo "Testing VNC through Tailscale..."

          if ! nc -z -w 10 "$IP" 5900; then
            echo "ERROR: VNC is not reachable through Tailscale."
            exit 1
          fi

          echo "===================================="
          echo "       MACOS VNC IS READY"
          echo "===================================="
          echo "Address: $IP"
          echo "Port: 5900"
          echo "macOS account: $USER_NAME"
          echo "Authentication: VNC Password"
          echo "Password: GitHub MAC_VNC_PASSWORD"
          echo "Network: Tailscale"
          echo "===================================="

          {
            echo "## macOS VNC Remote Desktop"
            echo ""
            echo "- Address: $IP"
            echo "- Port: 5900"
            echo "- macOS account: $USER_NAME"
            echo "- Authentication: VNC Password"
            echo "- Password: GitHub MAC_VNC_PASSWORD secret"
            echo "- Network: Tailscale"
          } >> "$GITHUB_STEP_SUMMARY"

      # ==========================================
      # 7. KEEP MACOS RUNNER ALIVE
      # ==========================================
      - name: Keep VNC Available
        shell: bash
        run: |
          echo "===================================="
          echo "macOS VNC SERVER RUNNING"
          echo "===================================="

          while true; do
            sleep 60
          done
